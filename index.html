// ===== Malzeme & model yardımcıları (Alan Becker tarzı çubuk adam) =====
const skinM=new THREE.MeshLambertMaterial({color:0xff8a1e}),scarfM=new THREE.MeshLambertMaterial({color:0xe5484d});
const OUT=new THREE.MeshBasicMaterial({color:0x14141a,side:THREE.BackSide});
const M=(geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);return m;};
function part(geo,mat,x,y,z,os){const m=M(geo,mat,x,y,z),o=new THREE.Mesh(geo,OUT);o.userData.ol=1;
  if(Array.isArray(os))o.scale.set(os[0],os[1],os[2]);else o.scale.setScalar(os||1.2);m.add(o);return m;}
function mkKnife(bl,hd){ // kelebek bıçak: namlu -z, kulplar +z
  const g=new THREE.Group(),bladeM=new THREE.MeshLambertMaterial({color:bl}),handM=new THREE.MeshLambertMaterial({color:hd});

  g.add(new THREE.Mesh(bg,bladeM));
  const mk=x=>{const p=new THREE.Group();p.position.set(x,0,0);p.add(M(new THREE.BoxGeometry(.012,.026,.11),handM,0,0,.055));g.add(p);return p;};
  return{g,bladeM,handM,hA:mk(-.012),hB:mk(.012)};
}
const setFlip=(k,t)=>{k.hA.rotation.x=Math.PI*(1-ease(t*2.4));k.hB.rotation.x=Math.PI*(1-ease(t*2.4-.5));};
function mkHat(h){const g=new THREE.Group(),hm=c=>new THREE.MeshLambertMaterial({color:c});
  if(h===1){const c=hm(0x33333f);g.add(M(new THREE.CylinderGeometry(.3,.3,.02,20),c,0,.17),M(new THREE.CylinderGeometry(.17,.17,.3,20),c,0,.33),M(new THREE.CylinderGeometry(.175,.175,.06,20),hm(0xe5484d),0,.22));}
  if(h===2){const c=hm(0xf5c518);g.add(M(new THREE.CylinderGeometry(.2,.17,.12,16),c,0,.24));for(let i=0;i<5;i++){const a=i/5*6.283;g.add(M(new THREE.ConeGeometry(.04,.12,6),c,Math.sin(a)*.17,.36,Math.cos(a)*.17));}}
  if(h===3)g.add(M(new THREE.SphereGeometry(.225,16,10,0,6.283,0,1.57),hm(0xff7a1a),0,0,0),M(new THREE.SphereGeometry(.05,10,8),hm(0xffffff),0,.23,0));
  return g;}
function limb(a,b,r,mat){const g=new THREE.Group(),k=new THREE.Group(),os=[1.55,1.01,1.55];
  g.add(part(new THREE.CylinderGeometry(r,r,a,10),mat,0,-a/2,0,os),part(new THREE.SphereGeometry(r*1.15,10,8),mat,0,0,0,1.3));
  k.position.y=-a;
  k.add(part(new THREE.CylinderGeometry(r,r*.92,b,10),mat,0,-b/2,0,os),part(new THREE.SphereGeometry(r*1.15,10,8),mat,0,0,0,1.3),part(new THREE.SphereGeometry(r*1.5,12,10),mat,0,-b,0,1.28));
  g.add(k);return{g,k};}
function buildRig(mat,kc){
  const man=new THREE.Group(),body=new THREE.Group(),upper=new THREE.Group(),head=new THREE.Group(),hatG=new THREE.Group();
  man.add(body);body.add(upper);upper.position.y=.84;
  upper.add(part(new THREE.CylinderGeometry(.05,.05,.7,10),mat,0,.35,0,[1.55,1.01,1.55]));
  head.position.y=.92;upper.add(head);head.add(part(new THREE.SphereGeometry(.2,24,16),mat,0,0,0,1.13),hatG);
  const scarf=part(new THREE.TorusGeometry(.085,.032,8,16),scarfM,0,.71,0,1.25);scarf.rotation.x=Math.PI/2;upper.add(scarf);
  const legL=limb(.42,.42,.05,mat),legR=limb(.42,.42,.05,mat),armL=limb(.34,.32,.045,mat),armR=limb(.34,.32,.045,mat);
  legL.g.position.set(.07,.84,0);legR.g.position.set(-.07,.84,0);body.add(legL.g,legR.g);
  armL.g.position.set(.05,.64,0);armR.g.position.set(-.05,.64,0);upper.add(armL.g,armR.g);

let tt=0;
function pose(q,s,dt){
  const kk=n=>1-Math.exp(-n*dt),d=(o,k,v,n)=>{o[k]+=(v-o[k])*kk(n);};
  const p=s.p,A=.7+s.run*.5,w=(1-s.air)*(1-s.hang)*(1-s.wall*.5);
  const sL=Math.sin(p),sR=-sL,cL=Math.max(0,-Math.cos(p)),cR=Math.max(0,Math.cos(p)),a=Math.sin(Math.PI*s.atk);
  d(q.legL.g.rotation,'x',w*sL*A*s.amt-s.air*.8+s.hang*.15,16);
  d(q.legR.g.rotation,'x',w*sR*A*s.amt-s.air*.3+s.hang*.05,16);
  d(q.legL.k.rotation,'x',w*(.15+cL*1.1)*s.amt+s.air*1.2+s.hang*.35,16);
  d(q.legR.k.rotation,'x',w*(.15+cR*1.1)*s.amt+s.air*.7+s.hang*.3,16);
  d(q.armL.g.rotation,'x',w*sR*A*.9*s.amt-s.air*1.6-s.hang*2.9+Math.sin(tt*1.6)*.03,14);
  d(q.armL.g.rotation,'z',s.air*.55+.05,14);
  d(q.armL.k.rotation,'x',-(.3+s.run*.7)*s.amt-.12-s.air*.4,14);
  d(q.armR.g.rotation,'x',-.7+w*sL*.25*s.amt-s.air*.9-s.hang*2.2-a*1.5,s.atk>0?36:14);
  d(q.armR.g.rotation,'z',-s.air*.4,14);
  d(q.armR.k.rotation,'x',-1+s.hang*.7,14);
  d(q.upper.rotation,'y',sL*.16*s.amt+a*.55,s.atk>0?30:12);
  d(q.upper.rotation,'x',s.run*.28*s.amt-s.hang*.1,8);
  d(q.body.rotation,'z',s.lean,8);
  q.body.position.y=-(1-Math.abs(Math.cos(p)))*.07*s.amt*(1-s.air);
  q.upper.scale.y=1+Math.sin(tt*1.8)*.01*(1-s.amt);
}
const pr=buildRig(skinM,[0xcfd5dc,0x2a2d33]);scene.add(pr.man);

// ===== Dünya: spawn, parkur kulesi, arena =====
const B=[],inst=[];
function box(cx,cz,w,d,y0,y1,pi,col){B.push({x0:cx-w/2,x1:cx+w/2,z0:cz-d/2,z1:cz+d/2,y0,y1,pi});inst.push([cx,(y0+y1)/2,cz,w,y1-y0,d,col]);}
function sign(txt,x,y,z,col){const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');g.fillStyle=col;g.fillRect(0,0,512,128);g.fillStyle='#fff';g.font='bold 60px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,256,66);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(8,2),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),side:THREE.DoubleSide}));m.position.set(x,y,z);scene.add(m);}
const HARD_N=800; // ZOR bölüm parça sayısı: hatasız ~1,5 saat hedefi için ayarlanabilir
const TIERS=[{name:'KOLAY',n:28,col:0x5ecb6a},{name:'ORTA',n:70,col:0xf2c14e},{name:'ZOR',n:HARD_N,col:0xe0566a}];
const PIECES=[],TIER_OF=[0];
(function gen(){
  let rs=20260707;const rnd=()=>{rs=(rs*16807)%2147483647;return rs/2147483647;};
  const SIDE=60,CZ=-90,DIRS=[[1,0],[0,-1],[-1,0],[0,1]];
  let bx=-30,bz=CZ+30,dir=0,along=0,lat=0,y=.55,prevS=8,idx=0;
  PIECES.push({x:bx,z:bz,top:y,s:8,cp:true});box(bx,bz,8,8,y-1,y,0,0x888888);
  sign('PARKUR ↑',bx,7,bz+6,'#2a6fdb');
  TIERS.forEach((T,ti)=>{T.s0=idx+1;
    for(let k=0;k<T.n;k++){
      idx++;TIER_OF[idx]=ti;
      const cp=k===0||(ti===0&&k%7===0)||(ti===1&&k%14===0),r=rnd();let s,gap,dy,kind='p';
      if(cp){s=5;gap=2.5;dy=.3;}
      else if(ti===0){s=4.4+rnd();gap=1.5+rnd()*1.3;dy=.2+rnd()*.5;}
      else if(ti===1){s=3.2+rnd()*.8;gap=2.6+rnd()*1.5;dy=.2+rnd()*.7;if(r<.12){kind='ledge';gap=1+rnd()*.6;dy=2.1+rnd()*.3;s=3.4;}else if(r<.2){kind='wall';gap=8.5+rnd()*1.2;dy=.3;s=3.4;}}
      else{s=2.3+rnd()*.7;gap=3.7+rnd()*1.5;dy=.2+rnd()*.9;if(r<.16){kind='ledge';gap=1+rnd()*.5;dy=2.2+rnd()*.3;s=3.2;}else if(r<.28){kind='wall';gap=8.5+rnd()*1.3;dy=.3;s=3;}}
      const adv=prevS/2+gap+s/2,d=DIRS[dir],pp=[-d[1],d[0]],ox=bx+pp[0]*lat,oz=bz+pp[1]*lat,oy=y;
      bx+=d[0]*adv;bz+=d[1]*adv;along+=adv;y+=dy;
      lat=kind==='p'&&!cp?clamp(lat*.6+(rnd()-.5)*2.4,-1.6,1.6):0;
      const px=bx+pp[0]*lat,pz=bz+pp[1]*lat;
      if(kind==='wall'){const L=gap+4,side=rnd()<.5?-1:1,off=side*(Math.max(prevS,s)/2+.55),mx=(ox+px)/2+pp[0]*off,mz=(oz+pz)/2+pp[1]*off,yr=Math.max(oy,y);
        box(mx,mz,d[0]?L:.6,d[0]?.6:L,yr-2,yr+6.5,-5,0x7a5cd6);}
      PIECES.push({x:px,z:pz,top:y,s,cp});
      box(px,pz,s,s,y-1,y,idx,cp?0x4cc9f0:T.col+((rnd()*24|0)<<8));
      prevS=s;
      if(along>=SIDE){dir=(dir+1)%4;along=0;lat=0;}
    }});
})();
const TOTAL=PIECES.length-1;
(function(){
  const im=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial(),inst.length);
  const mt=new THREE.Matrix4(),q=new THREE.Quaternion(),sc=new V3(),ps=new V3(),cc=new THREE.Color();
  inst.forEach((a,i)=>{ps.set(a[0],a[1],a[2]);sc.set(a[3],a[4],a[5]);mt.compose(ps,q,sc);im.setMatrixAt(i,mt);im.setColorAt(i,cc.setHex(a[6]));});
  im.frustumCulled=false;im.castShadow=im.receiveShadow=true;scene.add(im);
})();
// Arena
const AC={x:-38,z:6},AR=13;
const disc=new THREE.Mesh(new THREE.CircleGeometry(AR,48),new THREE.MeshLambertMaterial({color:0xb04a4a}));disc.rotation.x=-Math.PI/2;disc.position.set(AC.x,.03,AC.z);disc.receiveShadow=true;scene.add(disc);
for(let i=0;i<16;i++){const a=i/16*6.283,pl=M(new THREE.CylinderGeometry(.18,.18,1.8,8),new THREE.MeshLambertMaterial({color:i%2?0xffffff:0xe5484d}),AC.x+Math.cos(a)*AR,.9,AC.z+Math.sin(a)*AR);pl.castShadow=true;scene.add(pl);}
sign('KAPIŞMA ARENASI',AC.x,7,AC.z,'#b02a2a');

// ===== Fizik / parkur hareketleri =====
const GRAV=24,JUMP=9.4,WALK=3.6,RUN=9.5,R=.3,H=1.8,STEP=.6,SNAP=.65;
const P=new V3(0,0,14),vel=new V3(),hangN=new V3(),hangPos=new V3(),mFrom=new V3(),mTo=new V3(),wallTan=new V3(),wallN=new V3();
let st='air',grounded=false,onB=null,coyote=0,runT=0,runK=0,hangT=0,mT=0,wallT=0,wallCool=0,wallSide=0,wallK=0,wallLost=0,wallSp=8,hangB=null,land=0;
const ov=(b,x,y,z)=>x+R>b.x0&&x-R<b.x1&&z+R>b.z0&&z-R<b.z1&&y+H>b.y0&&y<b.y1;
function physics(dt,inX,inZ,mvx,mvz,mag){
  jumpBuf=Math.max(0,jumpBuf-dt);wallCool=Math.max(0,wallCool-dt);coyote=Math.max(0,coyote-dt);
  const fwdIn=inZ>.35&&Math.abs(inX)<.6;
  runT=fwdIn?Math.min(1.6,runT+dt):Math.max(0,runT-dt*3);const rk=runT/1.6;runK=rk*rk*(3-2*rk);
  if(st==='hang'){hangT+=dt;P.copy(hangPos);vel.set(0,0,0);
    if(inZ<-.6){st='air';vel.x=hangN.x*2;vel.z=hangN.z*2;wallCool=.4;return;}
    if(jumpBuf>0||hangT>.5){jumpBuf=0;st='mantle';mT=0;mFrom.copy(P);mTo.set(P.x-hangN.x*.8,hangB.y1,P.z-hangN.z*.8);}return;}
  if(st==='mantle'){mT+=dt/.5;const e=ease(mT);P.y=mFrom.y+(mTo.y-mFrom.y)*Math.min(1,e*1.7);
    const u=clamp((e-.3)/.7,0,1);P.x=mFrom.x+(mTo.x-mFrom.x)*u;P.z=mFrom.z+(mTo.z-mFrom.z)*u;
    if(mT>=1){st='air';vel.set(0,0,0);}return;}
  const v0x=vel.x,v0z=vel.z;
  if(st==='wall'){wallT+=dt;vel.x=wallTan.x*wallSp-wallN.x*1.5;vel.z=wallTan.z*wallSp-wallN.z*1.5;vel.y=wallT<.3?1:-.8;
    if(jumpBuf>0){jumpBuf=0;vel.x=wallN.x*5.5+wallTan.x*wallSp*.85;vel.z=wallN.z*5.5+wallTan.z*wallSp*.85;vel.y=JUMP*.95;st='air';wallCool=.35;}}
  else{const speed=mag<.05?0:(inZ<-.2?WALK*.85:(fwdIn?WALK+(RUN-WALK)*runK:WALK))*mag,k=1-Math.exp(-(grounded?12:3.2)*dt);
    vel.x+=(mvx*speed-vel.x)*k;vel.z+=(mvz*speed-vel.z)*k;vel.y=Math.max(vel.y-GRAV*dt,-28);
    if(jumpBuf>0&&(grounded||coyote>0)){vel.y=JUMP;grounded=false;coyote=0;jumpBuf=0;burst(new V3(P.x,P.y+.05,P.z),8,0xe8e2d0,2,1,.12);}}
  let hx=null,hz=null,nx=P.x+vel.x*dt;
  for(const b of B){if(b.y1<=P.y+STEP)continue;if(ov(b,nx,P.y,P.z)){hx=b;break;}}
  if(hx){nx=P.x;vel.x=0;}P.x=nx;
  let nz=P.z+vel.z*dt;
  for(const b of B){if(b.y1<=P.y+STEP)continue;if(ov(b,P.x,P.y,nz)){hz=b;break;}}
  if(hz){nz=P.z;vel.z=0;}P.z=nz;
  const hit=hx||hz;
  if(st==='wall'){if(hit)wallLost=0;else wallLost+=dt;}
  else if(hit&&!grounded){
    let b,nxn=0,nzn=0;
    if(hx&&(!hz||Math.abs(v0x)>=Math.abs(v0z))){b=hx;nxn=v0x>0?-1:1;}else{b=hz;nzn=v0z>0?-1:1;}
    const dy=b.y1-P.y;
    if(dy>.9&&dy<2.3&&wallCool<=0){st='hang';hangB=b;hangN.set(nxn,0,nzn);hangT=0;
      hangPos.set(P.x,b.y1-1.85,P.z);if(nxn)hangPos.x=nxn<0?b.x0-R-.03:b.x1+R+.03;else hangPos.z=nzn<0?b.z0-R-.03:b.z1+R+.03;
      vel.set(0,0,0);P.copy(hangPos);return;}
    if(dy>=2.6&&wallCool<=0&&Math.hypot(v0x,v0z)>5){
      let tx=-nzn,tz=nxn;if(tx*v0x+tz*v0z<0){tx=-tx;tz=-tz;}const along=Math.abs(tx*v0x+tz*v0z);
      if(along>4){st='wall';wallN.set(nxn,0,nzn);wallTan.set(tx,0,tz);wallSp=Math.max(8,along+1);wallT=0;wallLost=0;
        wallSide=Math.sign(nxn*tz-nzn*tx)||1;burst(new V3(P.x,P.y+1,P.z),8,0xffffff,2,1,.1);}}
  }
  const py=P.y,vyB=vel.y;let ny=py+vel.y*dt,gr=false;onB=null;
  if(vel.y<=0){let best=-1e9,bb=null;
    for(const b of B){if(P.x+R>b.x0&&P.x-R<b.x1&&P.z+R>b.z0&&P.z-R<b.z1&&b.y1<=py+SNAP&&b.y1>=ny-.001&&b.y1>best){best=b.y1;bb=b;}}
    if(bb){ny=bb.y1;vel.y=0;gr=true;onB=bb;}else if(ny<=0){ny=0;vel.y=0;gr=true;}}
  else{for(const b of B){if(P.x+R>b.x0&&P.x-R<b.x1&&P.z+R>b.z0&&P.z-R<b.z1&&b.y0>=py+H-.02&&b.y0<ny+H){ny=b.y0-H;vel.y=0;break;}}}
  P.y=ny;
  if(gr&&!grounded&&vyB<-6){land=1;burst(new V3(P.x,P.y+.05,P.z),14,0xe8e2d0,3,1.5,.14);}
  grounded=gr;if(gr)coyote=.12;
  if(st==='wall'&&(wallLost>.12||wallT>1.5||grounded)){st='air';wallCool=.3;}
}

let maxIdx=0,cpIdx=0,errs=0,courseOn=false,courseT=0,done=false,flashV=0,statT=0;
function fail(){errs++;flashV=1;toast('Düştün! Hata: '+errs);const c=PIECES[cpIdx];P.set(c.x,c.top,c.z);vel.set(0,0,0);st='air';maxIdx=cpIdx;}
function courseTick(dt){
  if(courseOn&&!done)courseT+=dt;
  if(onB&&onB.pi>=0){const i=onB.pi;
    if(i>maxIdx){maxIdx=i;if(i>=1)courseOn=true;
      if(TIER_OF[i]===2&&i%50===0)reward(40,'Kilometre taşı');
      if(i===TOTAL&&!done){done=true;reward(1000,'PARKUR TAMAMLANDI! Hata: '+errs);}}
    if(PIECES[i].cp&&i>cpIdx){cpIdx=i;reward([15,30,60][TIER_OF[i]],'Checkpoint');}
    if(i<maxIdx-2)fail();}
  else if(grounded&&!onB&&maxIdx>=1&&P.y<=.05)fail();
}
function updStat(){let t='Parkur: Kolay → Orta → Zor • Mavi pedden başla';
  if(courseOn){const T=TIERS[TIER_OF[maxIdx]],k=Math.max(1,maxIdx-T.s0+1),m=Math.floor(courseT/60),s=Math.floor(courseT%60);
    t=T.name+' '+k+'/'+T.n+' • ⏱ '+(m>=60?Math.floor(m/60)+':':'')+String(m%60).padStart(2,'0')+':'+String(s).padStart(2,'0')+' • Hata '+errs;}
  $('stat').textContent=t;}
function tpTo(x,y,z,yw,course){P.set(x,y,z);vel.set(0,0,0);st='air';yaw=yw;maxIdx=cpIdx=0;courseOn=false;courseT=0;errs=0;done=false;play();}
function goParkour(){tpTo(PIECES[0].x,PIECES[0].top,PIECES[0].z,-Math.PI/2);}
function goArena(){tpTo(AC.x+8,0,AC.z+8,Math.PI/4);}

// ===== Arena: bıçak dövüşü =====
let hp=100,atkP=0,atkCd=0,atkHit=false;
function hurt(d,nx,nz){hp-=d;flashV=.6;vel.x+=nx*4;vel.z+=nz*4;if(hp<=0){hp=100;P.set(0,0,14);vel.set(0,0,0);st='air';toast('Yenildin! Spawn noktasına döndün');}}
function attack(){atkP=.001;atkCd=.45;atkHit=false;}
function arena(dt,f){
  hp=Math.min(100,hp+dt*2);$('hp').style.width=hp+'%';
  const pin=Math.hypot(P.x-AC.x,P.z-AC.z)<AR+3&&P.y<3;
  if(atkP>.25&&!atkHit){atkHit=true;
    for(const b of bots){if(b.dead)continue;const dx=b.x-P.x,dz=b.z-P.z,d=Math.hypot(dx,dz)||1;
      if(d<2.6&&(dx*f.x+dz*f.z)/d>.15&&P.y<2){b.hp--;b.kx=dx/d*7;b.kz=dz/d*7;burst(new V3(b.x,1.1,b.z),10,0xff4040,3,3,.08);
        if(b.hp<=0){b.dead=4;reward(10,'Rakip yenildi');}}}}
  for(const b of bots){
    if(b.dead>0){b.dead-=dt;b.rg.man.rotation.x=-1.45;if(b.dead<=0){b.dead=0;b.hp=3;b.x=b.hx;b.z=b.hz;b.rg.man.rotation.x=0;}b.rg.man.position.set(b.x,.12,b.z);continue;}
    const tx=pin?P.x:b.hx,tz=pin?P.z:b.hz,dx=tx-b.x,dz=tz-b.z,d=Math.hypot(dx,dz)||1,sp=d>(pin?1.4:.6)?(pin?3.8:2.2):0;
    b.x+=(dx/d*sp+b.kx)*dt;b.z+=(dz/d*sp+b.kz)*dt;b.kx*=Math.exp(-6*dt);b.kz*=Math.exp(-6*dt);
    let da=Math.atan2(dx,dz)-b.face;da=Math.atan2(Math.sin(da),Math.cos(da));b.face+=da*Math.min(1,dt*10);
    b.p+=dt*(3+sp*1.1)*(sp>0?1:0);b.cd-=dt;
    if(pin&&d<1.9&&b.cd<=0&&P.y<1.5){b.cd=1.3;b.a=.001;b.h=false;}
    if(b.a>0){b.a+=dt/.35;if(b.a>.5&&!b.h){b.h=true;if(d<2.2)hurt(8,dx/d,dz/d);}if(b.a>=1){b.a=0;}}
    pose(b.rg,{p:b.p,amt:sp>0?1:0,run:sp>3?.8:.2,air:0,hang:0,wall:0,atk:b.a,lean:0},dt);
    b.rg.man.position.set(b.x,0,b.z);b.rg.man.rotation.y=b.face;
  }
}

// ===== Ana döngü =====
const clock=new THREE.Clock();
let faceAng=0,phase=0,amt=0,airT=0,hangK=0,curFov=80,pitchS=.2,menuAng=0,fpT=0,flipT=1,idleT=0,fpOn=false,trT=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05),kk=n=>1-Math.exp(-n*dt);tt+=dt;
  let x=0,z=0;
  if(!menuOpen){x=ix+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);z=iz+(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
    const l=Math.hypot(x,z);if(l>1){x/=l;z/=l;}}
  const f=new V3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new V3(Math.cos(yaw),0,-Math.sin(yaw));
  const L=Math.hypot(x,z)||1,mvx=(f.x*z+r.x*x)/L,mvz=(f.z*z+r.z*x)/L,mag=Math.min(1,Math.hypot(x,z));
  atkCd-=dt;if(atkP>0){atkP+=dt/.32;if(atkP>=1)atkP=0;}
  if(!menuOpen){if(firing&&atkCd<=0&&atkP===0)attack();physics(dt,x,z,mvx,mvz,mag);courseTick(dt);arena(dt,f);}
  const hs=Math.hypot(vel.x,vel.z);
  amt+=((menuOpen?0:st==='wall'?1.1:grounded?clamp(hs/5,0,1.2):0)-amt)*kk(10);
  airT+=(((!menuOpen&&!grounded&&st==='air')?1:0)-airT)*kk(14);
  hangK+=(((st==='hang'||st==='mantle')?1:0)-hangK)*kk(12);
  wallK+=((st==='wall'?1:0)-wallK)*kk(10);
  phase+=dt*(3+hs*1.1)*(amt>.02?1:0);
  let tg=faceAng;
  if(st==='wall')tg=Math.atan2(wallTan.x,wallTan.z);else if(st==='hang'||st==='mantle')tg=Math.atan2(-hangN.x,-hangN.z);
  else if(atkP>0)tg=Math.atan2(f.x,f.z);else if(hs>.8)tg=Math.atan2(vel.x,vel.z);
  let da=tg-faceAng;da=Math.atan2(Math.sin(da),Math.cos(da));faceAng+=da*kk(st==='hang'?30:12);
  land=Math.max(0,land-dt*5);pr.body.scale.set(1+land*.07,1-land*.12,1+land*.07);
  pose(pr,{p:phase,amt,run:runK,air:airT,hang:hangK,wall:wallK,atk:atkP,lean:-wallSide*.28*wallK},dt);
  pr.man.position.copy(P);pr.man.rotation.y=faceAng;
  // iz efekti
  trT-=dt;if(!menuOpen&&grounded&&hs>3&&trT<=0){trT=runK>.6?.04:.08;
    const t=view.trail,ps=new V3(P.x+(Math.random()-.5)*.3,P.y+.1,P.z+(Math.random()-.5)*.3),pk=a=>a[Math.random()*a.length|0];
    let col=0xe8e2d0,vy=.6,g=-.3,m=1,sz=.12;
    if(t==='tr_fire'){col=pk([0xff5a1a,0xffb02e,0xffe27a]);vy=1.2;g=-2;m=0;sz=.16;}
    else if(t==='tr_ice'){col=pk([0x9fe7ff,0xffffff,0x6fb7ff]);vy=.7;g=-1;m=0;sz=.13;}
    else if(t==='tr_rain'){col=new THREE.Color().setHSL((tt*.8)%1,1,.6);vy=.8;g=-1;m=0;sz=.15;}
    puff(ps,new V3((Math.random()-.5)*.6,vy,(Math.random()-.5)*.6),col,sz,.5,g,m);}
  for(let i=fx.length-1;i>=0;i--){const o=fx[i];o.t-=dt;
    if(o.t<=0){scene.remove(o.m);o.m.material.dispose();fx.splice(i,1);continue;}
    const a=o.t/o.T;o.v.y-=o.g*dt;o.m.position.addScaledVector(o.v,dt);o.m.material.opacity=Math.min(1,a*1.5);
    o.m.scale.setScalar(o.mode===0?o.s*a+.01:o.s*(1+(1-a)*2));}
  // kamera: sadece yaw; yükseklik duruma göre otomatik
  const tf=menuOpen?38:save.set.fov+runK*9+wallK*5-(hangK>.5?4:0);
  curFov+=(tf-curFov)*kk(menuOpen?20:6);if(Math.abs(cam.fov-curFov)>.02){cam.fov=curFov;cam.updateProjectionMatrix();}
  const pt=(st==='hang'||st==='mantle')?-.18:.2+(grounded?0:clamp(-vel.y*.012,-.25,.32));
  pitchS+=(pt-pitchS)*kk(5);const cp=Math.cos(pitchS),sp=Math.sin(pitchS);
  pr.man.visible=true;pr.body.visible=!(fp&&!menuOpen);
  if(menuOpen){menuAng+=dt*.7;cam.position.set(P.x,P.y+1.25,P.z+4.2);cam.lookAt(P.x,P.y+1,P.z);pr.man.rotation.y=menuAng;}
  else if(fp){cam.position.set(P.x+f.x*.12,P.y+1.74+Math.sin(phase*2)*.03*amt*(1-airT),P.z+f.z*.12);
    const fpP=clamp(pitchS-.2,-.3,.3)*.7;cam.lookAt(cam.position.x+f.x*8,cam.position.y-Math.tan(fpP)*8,cam.position.z+f.z*8);}
  else{const D=3.6+runK*.9+hangK*1.4,pv=new V3(P.x,P.y+1.5,P.z).addScaledVector(r,.85);
    cam.position.set(pv.x-f.x*cp*D,Math.max(.3,pv.y+sp*D),pv.z-f.z*cp*D);cam.lookAt(pv.x+f.x*8,pv.y,pv.z+f.z*8);}
  if(!menuOpen)cam.rotateZ(wallSide*.16*wallK-x*.02*amt);
  sun.position.set(P.x+10,P.y+20,P.z+6);sun.target.position.copy(P);
  xh.style.transform='translate(-50%,-50%) scale('+(1+amt*.1+runK*.1+airT*.12).toFixed(3)+')';
  // FP bıçak animasyonu
  fpT+=((fp&&!menuOpen?1:0)-fpT)*kk(7);
  if(fpOn!==fp){fpOn=fp;if(fp)flipT=0;}
  flipT=Math.min(1,flipT+dt/.9);idleT=(amt<.1&&grounded&&atkP===0)?idleT+dt:0;if(idleT>6){idleT=0;flipT=0;}
  setFlip(vk,flipT);
  sw.x+=(clamp(lk.x*.0018,-.07,.07)-sw.x)*kk(10);lk.x=0;
  const e=1-fpT,as=Math.sin(Math.PI*atkP),hide=(st==='hang'||st==='mantle')?.45:0;
  vm.position.set(vmBX+Math.cos(phase)*.014*amt-sw.x*.4-as*.28,-.24-Math.abs(Math.sin(phase))*.016*amt+Math.sin(tt*1.5)*.003+airT*.03-e*.45-hide-runK*.03,-.46-as*.12);
  const sp1=1-(1-Math.min(1,flipT*1.4))**3;
  kr.rotation.set(.55-runK*.25+as*.3,.4-as*1+sw.x,-.3+as*.9-(1-sp1)*6.283);
  arc.visible=atkP>.12&&atkP<.8;arc.material.opacity=as*.7;arc.rotation.z=-.4+atkP*1.2;
  flashV=Math.max(0,flashV-dt*1.5);$('flash').style.opacity=flashV;
  statT-=dt;if(statT<=0&&!menuOpen){statT=.25;updStat();}
  renderer.clear();renderer.render(scene,cam);
  if(fp&&!menuOpen){renderer.clearDepth();renderer.render(vmScene,vmCam);}
}
applyCosmetics();showMain();fit();loop();
</script></body></html>
